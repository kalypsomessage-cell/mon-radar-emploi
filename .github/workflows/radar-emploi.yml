
name: Radar Emploi quotidien

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  radar:
    name: Collecte quotidienne
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier l'heure francaise
        id: horaire
        shell: bash
        run: |
          HEURE=$(TZ=Europe/Paris date +%H)
          echo "heure=$HEURE" >> "$GITHUB_OUTPUT"

      - name: Installer Python
        if: github.event_name == 'workflow_dispatch' || steps.horaire.outputs.heure == '08'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executer le Radar Emploi
        if: github.event_name == 'workflow_dispatch' || steps.horaire.outputs.heure == '08'
        env:
          RADAR_SOURCES_JSON: ${{ secrets.RADAR_SOURCES_JSON }}
        run: python radar/collecte_offres.py

      - name: Publier le bilan sur GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.horaire.outputs.heure == '08'
        shell: bash
        run: |
          if git diff --quiet -- radar_mouries.json; then
            echo 'Aucun nouveau bilan a publier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar_mouries.json
          git commit -m 'Radar quotidien : actualiser les offres'
          git push
